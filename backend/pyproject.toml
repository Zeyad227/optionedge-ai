[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optionedge-ai"
version = "0.1.0"
description = "Probabilistic options trading signal platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "yfinance>=0.2.48",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "apscheduler>=3.10.4",
  "feedparser>=6.0.11",
  "lxml>=5.3.0",
  "python-dateutil>=2.9.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.21.0",
  "httpx>=0.27.0",
  "ruff==0.16.7",
]
ml = [
  "transformers>=4.46.0",
  "torch>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
