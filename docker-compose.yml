# Optional — Docker Desktop is not required for local dev.
# Without Docker the backend uses SQLite + in-memory cache (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: optionedge
      # Local-only default. Set POSTGRES_PASSWORD in .env before exposing this anywhere.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optionedge}
      POSTGRES_DB: optionedge
    # Bound to loopback so the dev database is not reachable from the local network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optionedge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://optionedge:${POSTGRES_PASSWORD:-optionedge}@postgres:5432/optionedge
      REDIS_URL: redis://redis:6379/0
      CACHE_BACKEND: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  model_cache:
